services:
  - type: web
    name: geo-engine
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: geo-engine-integration-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEO_ENGINE_HANDOFF_TOKEN
        sync: false
      - key: GEO_ENGINE_INTEGRATION_STORE
        value: /var/data/integration
